# Imobiliárias locais de Fortaleza.
#
# ATENÇÃO: os modelos de URL abaixo seguem os padrões mais comuns das
# plataformas de site imobiliário do mercado e NÃO foram validados contra os
# sites reais (o ambiente de desenvolvimento não tinha acesso de rede a eles).
# Antes de confiar nos números, rode para cada site:
#
#   python -m garimpador recon <url-da-busca-no-site>
#
# e ajuste `urls_busca`, `padrao_link` e, se preciso, `seletor_card` /
# `seletores_detalhe`. Depois marque `validated: true`.
#
# Cada entrada aceita vários `urls_busca`: são tentados em ordem e o primeiro
# que devolver anúncios é usado. Placeholders: {pagina} {transacao} {tipo}
# {tipo_plural} {cidade} {bairro} {uf} {area_min} {area_max} {preco_min} {preco_max}

- nome: Magno Muniz Imóveis
  chave: magnomuniz
  base_url: https://www.magnomuniz.com.br/
  urls_busca:
    - /imoveis/{transacao}/{tipo}/{cidade}/{bairro}?pagina={pagina}
    - /{transacao}/{tipo}/{cidade}/{bairro}?pagina={pagina}
    - /imoveis/a-{transacao}/{tipo}/{cidade}?pagina={pagina}
  padrao_link: '/imove(l|is)/[^?#]*\d{3,}'
  seletor_contato: 'footer, [class*="contato"], [class*="contact"]'
  contato_padrao: Magno Muniz Imóveis
  paginacao: true
  validated: false

