# Site ASP.NET (SiteSys): a busca e o anúncio são identificados por querystring.
- nome: SJ Imóveis
  chave: sj
  base_url: https://www.sj.com.br/
  urls_busca:
    - /SiteSys/site.aspx?pagina={pagina}&finalidade={transacao}&tipo={tipo}&cidade={cidade}&bairro={bairro}
    - /SiteSys/site.aspx
  padrao_link: '(?i)(imovel|detalhe|codigo=|cod=|id=)'
  seletor_contato: 'footer, [id*="contato"], [class*="contato"]'
  contato_padrao: SJ Imóveis
  paginacao: false
  validated: false
